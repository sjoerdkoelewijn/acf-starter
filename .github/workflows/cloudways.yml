name: Cloudways

# Run WP-CLI on a Cloudways site from GitHub: production (or the demo), and
# staging when you have one.
#
# Start it by hand: Actions -> Cloudways -> Run workflow. Pick what to do.
# The run log shows everything the server printed, so a failure can be read
# and fixed without opening a terminal.
#
# Secrets this workflow needs. Put them in
# Settings -> Secrets and variables -> Actions -> Repository secrets.
#
#   CW_SSH_HOST          The server IP from the Cloudways panel.
#   CW_SSH_USER          An application SSH user. Do not use the master user.
#   CW_SSH_KEY           The private key. Its public half goes on Cloudways.
#   CW_APP_PATH          applications/<your-app>/public_html
#   CW_SSH_PORT          Optional. 22 when it is not set.
#   CW_SSH_KNOWN_HOSTS   Optional. The output of
#                        ssh-keyscan <host>. Without it the first run
#                        trusts whatever answers, which is weaker.
#
# For a staging site, also:
#
#   CW_STAGING_SSH_USER  The application SSH user of the staging app.
#   CW_STAGING_APP_PATH  applications/<staging-app>/public_html
#   CW_STAGING_SSH_HOST  Optional. Same as CW_SSH_HOST when it is not set.
#   CW_STAGING_SSH_KEY   Optional. Same as CW_SSH_KEY when it is not set.
#
# See demo/README.md for the full setup.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        type: choice
        required: true
        default: status
        options:
          - status
          - deploy
          - provision
          - seed
          - seed-fresh
          - purge
          - diagnose
          - migrate-status
          - migrate
          - content-diff
          - content-preview
          - content-sync
          - wp
      target:
        description: "Which site. The content actions ignore this: they always go from staging to production."
        type: choice
        required: true
        default: production
        options:
          - production
          - staging
      wp_command:
        description: "For action 'wp': the WP-CLI command, without the word wp"
        type: string
        required: false
        default: ""
      confirm_fresh:
        description: "Tick this to allow seed-fresh. It deletes the demo content first."
        type: boolean
        required: false
        default: false
      force_conflicts:
        description: "For content-sync: when production changed an item too, take the staging version anyway."
        type: boolean
        required: false
        default: false

# Two runs at once would fight over the same server.
concurrency:
  group: cloudways-demo
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    name: ${{ inputs.action }} (${{ startsWith(inputs.action, 'content-') && 'staging to production' || inputs.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      THEME_SLUG: acf-starter

    steps:
      - name: Get the repository
        uses: actions/checkout@v4

      - name: Check the secrets
        env:
          ACTION: ${{ inputs.action }}
          TARGET: ${{ inputs.target }}
          CW_SSH_HOST: ${{ secrets.CW_SSH_HOST }}
          CW_SSH_USER: ${{ secrets.CW_SSH_USER }}
          CW_SSH_KEY: ${{ secrets.CW_SSH_KEY }}
          CW_APP_PATH: ${{ secrets.CW_APP_PATH }}
          CW_STAGING_SSH_USER: ${{ secrets.CW_STAGING_SSH_USER }}
          CW_STAGING_APP_PATH: ${{ secrets.CW_STAGING_APP_PATH }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "$CW_SSH_HOST" ] || missing="$missing CW_SSH_HOST"
          [ -n "$CW_SSH_USER" ] || missing="$missing CW_SSH_USER"
          [ -n "$CW_SSH_KEY" ]  || missing="$missing CW_SSH_KEY"
          [ -n "$CW_APP_PATH" ] || missing="$missing CW_APP_PATH"

          # Staging is needed for the staging target and for every content action.
          case "$ACTION" in content-*) TARGET=staging ;; esac
          if [ "$TARGET" = "staging" ]; then
            [ -n "$CW_STAGING_SSH_USER" ] || missing="$missing CW_STAGING_SSH_USER"
            [ -n "$CW_STAGING_APP_PATH" ] || missing="$missing CW_STAGING_APP_PATH"
          fi

          if [ -n "$missing" ]; then
            echo "::error::These secrets are not set:$missing"
            echo "Add them under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "The secrets are there."

      - name: Guard the inputs
        env:
          ACTION: ${{ inputs.action }}
          WP_COMMAND: ${{ inputs.wp_command }}
          CONFIRM_FRESH: ${{ inputs.confirm_fresh }}
        run: |
          set -euo pipefail

          if [ "$ACTION" = "seed-fresh" ] && [ "$CONFIRM_FRESH" != "true" ]; then
            echo "::error::seed-fresh deletes the demo content first. Tick 'confirm_fresh' to allow it."
            exit 1
          fi

          if [ "$ACTION" != "wp" ]; then
            exit 0
          fi

          if [ -z "$WP_COMMAND" ]; then
            echo "::error::Action 'wp' needs a command in wp_command."
            exit 1
          fi

          # The command is sent to a shell on the server. Block every character
          # that could chain a second command onto it, so the input stays one
          # WP-CLI call and nothing else.
          if printf '%s' "$WP_COMMAND" | grep -q '[;&|<>`$()\\]'; then
            echo "::error::wp_command holds a shell character. Keep it to one plain WP-CLI command."
            exit 1
          fi

          if printf '%s' "$WP_COMMAND" | grep -q '[^[:print:]]'; then
            echo "::error::wp_command holds a control character."
            exit 1
          fi

          # Commands that lose data, or that run code this repository cannot review.
          deny='^(db (drop|reset|query|import)|site empty|core (download|update|multisite-)|user delete|plugin delete|theme delete|eval )'
          if printf '%s' "$WP_COMMAND" | grep -Eqi "$deny"; then
            echo "::error::That command is on the deny list. Change the workflow in a commit if you really need it."
            exit 1
          fi

          # search-replace rewrites the database. Only a dry run is allowed here.
          if printf '%s' "$WP_COMMAND" | grep -Eqi '^search-replace' && \
             ! printf '%s' "$WP_COMMAND" | grep -q -- '--dry-run'; then
            echo "::error::search-replace is allowed with --dry-run only."
            exit 1
          fi

          echo "wp $WP_COMMAND"

      - name: Set up SSH
        env:
          ACTION: ${{ inputs.action }}
          TARGET: ${{ inputs.target }}
          CW_SSH_HOST: ${{ secrets.CW_SSH_HOST }}
          CW_SSH_USER: ${{ secrets.CW_SSH_USER }}
          CW_SSH_KEY: ${{ secrets.CW_SSH_KEY }}
          CW_SSH_PORT: ${{ secrets.CW_SSH_PORT }}
          CW_SSH_KNOWN_HOSTS: ${{ secrets.CW_SSH_KNOWN_HOSTS }}
          CW_APP_PATH: ${{ secrets.CW_APP_PATH }}
          CW_STAGING_SSH_HOST: ${{ secrets.CW_STAGING_SSH_HOST }}
          CW_STAGING_SSH_USER: ${{ secrets.CW_STAGING_SSH_USER }}
          CW_STAGING_SSH_KEY: ${{ secrets.CW_STAGING_SSH_KEY }}
          CW_STAGING_APP_PATH: ${{ secrets.CW_STAGING_APP_PATH }}
        run: |
          set -euo pipefail

          staging_host="${CW_STAGING_SSH_HOST:-$CW_SSH_HOST}"
          staging_key="${CW_STAGING_SSH_KEY:-$CW_SSH_KEY}"

          # Keep the addresses out of the log.
          echo "::add-mask::$CW_SSH_HOST"
          echo "::add-mask::$staging_host"

          port="${CW_SSH_PORT:-22}"
          echo "SSH_PORT=$port" >> "$GITHUB_ENV"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$CW_SSH_KEY" > ~/.ssh/id_production
          printf '%s\n' "$staging_key" > ~/.ssh/id_staging
          chmod 600 ~/.ssh/id_production ~/.ssh/id_staging

          if [ -n "${CW_SSH_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$CW_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
            echo "Host keys came from CW_SSH_KNOWN_HOSTS."
          else
            for host in $(printf '%s\n%s\n' "$CW_SSH_HOST" "$staging_host" | sort -u); do
              ssh-keyscan -p "$port" -H "$host" >> ~/.ssh/known_hosts 2>/dev/null
            done
            echo "::warning::CW_SSH_KNOWN_HOSTS is not set, so this run trusts the key the server offered. Set the secret to close that gap."
          fi

          chmod 600 ~/.ssh/known_hosts

          # The content actions always go from staging to production. The
          # other actions go to the target you picked.
          case "$ACTION" in
            content-diff) TARGET=staging ;;
            content-*)    TARGET=production ;;
          esac

          host_block() {
            printf 'Host %s\n  HostName %s\n  User %s\n  Port %s\n  IdentityFile ~/.ssh/id_%s\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n  ServerAliveInterval 30\n\n' "$1" "$2" "$3" "$port" "$4"
          }

          {
            host_block production "$CW_SSH_HOST" "$CW_SSH_USER" production
            if [ -n "$CW_STAGING_SSH_USER" ]; then
              host_block staging "$staging_host" "$CW_STAGING_SSH_USER" staging
            fi
            if [ "$TARGET" = "staging" ]; then
              host_block cloudways "$staging_host" "$CW_STAGING_SSH_USER" staging
            else
              host_block cloudways "$CW_SSH_HOST" "$CW_SSH_USER" production
            fi
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

          {
            echo "TARGET=$TARGET"
            echo "PROD_PATH=$CW_APP_PATH"
            echo "STAGING_PATH=$CW_STAGING_APP_PATH"
            if [ "$TARGET" = "staging" ]; then
              echo "APP_PATH=$CW_STAGING_APP_PATH"
            else
              echo "APP_PATH=$CW_APP_PATH"
            fi
          } >> "$GITHUB_ENV"

          echo "Target: $TARGET"
          ssh -o ConnectTimeout=15 cloudways 'echo "Connected as $(whoami) on $(hostname)"'
          case "$ACTION" in
            content-preview|content-sync)
              ssh -o ConnectTimeout=15 staging 'echo "Staging: connected as $(whoami)"' ;;
          esac

      - name: Check the server
        run: |
          set -euo pipefail

          ssh cloudways "command -v wp >/dev/null" \
            || { echo "::error::WP-CLI is not on this server."; exit 1; }

          ssh cloudways "cd '$APP_PATH' && wp core is-installed" \
            || { echo "::error::No WordPress at $APP_PATH. Check the app path secret."; exit 1; }

          echo "WordPress $(ssh cloudways "cd '$APP_PATH' && wp core version")"
          echo "WP-CLI $(ssh cloudways 'wp --version' | awk '{print $2}')"

      - name: Send the theme
        if: inputs.action == 'deploy' || inputs.action == 'provision' || inputs.action == 'migrate'
        run: |
          set -euo pipefail

          target="$APP_PATH/wp-content/themes/$THEME_SLUG"

          # A wrong path plus --delete would remove the wrong folder. Refuse
          # anything that is not the theme folder.
          case "$target" in
            */wp-content/themes/"$THEME_SLUG") ;;
            *) echo "::error::The target path is wrong: $target"; exit 1 ;;
          esac

          ssh cloudways "command -v rsync >/dev/null" \
            || { echo "::error::rsync is not on the server."; exit 1; }

          ssh cloudways "mkdir -p '$target'"

          # demo/images and demo/plugins live on the server only, so your
          # photos and the ACF Pro zip survive a deploy.
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'node_modules/' \
            --exclude 'demo/images/' \
            --exclude 'demo/plugins/' \
            ./ "cloudways:$target/"

          echo "Theme sent to $target"
          ssh cloudways "cd '$APP_PATH' && wp theme activate '$THEME_SLUG'"

      - name: Do it
        env:
          ACTION: ${{ inputs.action }}
          WP_COMMAND: ${{ inputs.wp_command }}
          FORCE_CONFLICTS: ${{ inputs.force_conflicts }}
        run: |
          set -euo pipefail

          app="$APP_PATH"
          theme="$app/wp-content/themes/$THEME_SLUG"

          case "$ACTION" in

            status)
              ssh cloudways "cd '$app' && bash -s" <<'REMOTE'
                set -u
                echo "== Theme =="
                wp theme list --fields=name,status,version
                echo
                echo "== Plugins =="
                wp plugin list --fields=name,status,version
                echo
                echo "== Content =="
                printf 'products   %s\n' "$(wp post list --post_type=product --post_status=publish --format=count)"
                printf 'pages      %s\n' "$(wp post list --post_type=page --post_status=publish --format=count)"
                printf 'categories %s\n' "$(wp term list product_cat --format=count 2>/dev/null || echo 0)"
                printf 'media      %s\n' "$(wp post list --post_type=attachment --post_status=inherit --format=count)"
                echo
                echo "== Settings =="
                printf 'home          %s\n' "$(wp option get home)"
                printf 'permalinks    %s\n' "$(wp option get permalink_structure)"
                printf 'front page    %s\n' "$(wp option get show_on_front)"
                printf 'indexable     %s\n' "$(wp option get blog_public)"
                printf 'currency      %s\n' "$(wp option get woocommerce_currency 2>/dev/null || echo '-')"
                echo
                echo "== Field groups =="
                wp post list --post_type=acf-field-group --post_status=any --fields=post_title --format=csv 2>/dev/null || echo "none in the database yet"
          REMOTE
              ;;

            deploy)
              echo "The theme is on the server. Nothing else to do."
              ;;

            provision)
              ssh cloudways "cd '$app' && bash '$theme/demo/provision.sh'"
              ;;

            seed)
              ssh cloudways "cd '$app' && wp eval-file '$theme/demo/seed.php'"
              ;;

            seed-fresh)
              ssh cloudways "cd '$app' && wp eval-file '$theme/demo/seed.php' fresh"
              ;;

            purge)
              ssh cloudways "cd '$app' && wp cache flush && wp transient delete --all && wp rewrite flush"
              if ssh cloudways "cd '$app' && wp cli has-command 'breeze purge'"; then
                ssh cloudways "cd '$app' && wp breeze purge --cache=all" && echo "Breeze and Varnish purged."
              else
                echo "::notice::Breeze is not here, so Varnish is not cleared. Purge it in the Cloudways panel."
              fi
              ;;

            diagnose)
              ssh cloudways "cd '$app' && wp eval-file '$theme/demo/diagnose.php'"
              ;;

            migrate-status)
              # Look only. Nothing changes.
              ssh cloudways "cd '$app' && wp sgwrd migrate status && wp sgwrd migrate run --dry-run"
              ;;

            migrate)
              # The theme with the new migrations went up in the step before.
              plan="$(ssh cloudways "cd '$app' && wp sgwrd migrate run --dry-run")"
              printf '%s\n' "$plan"
              if ! printf '%s\n' "$plan" | grep -q 'Would run'; then
                echo "Nothing to do. All migrations ran."
                exit 0
              fi

              # No backup, no migration.
              ssh cloudways "cd '$app' && bash -s -- before-migrate" < .github/scripts/backup-db.sh
              ssh cloudways "cd '$app' && wp sgwrd migrate run && wp sgwrd migrate status && wp cache flush"
              ssh cloudways "cd '$app' && if wp cli has-command 'breeze purge'; then wp breeze purge --cache=all; fi"
              ;;

            content-diff)
              # Look only, on staging.
              ssh cloudways "cd '$app' && wp sgwrd content diff"
              ;;

            content-preview|content-sync)
              # Both sites need a theme with the content sync in it.
              ssh staging "cd '$STAGING_PATH' && wp cli has-command 'sgwrd content'" \
                || { echo "::error::The theme on staging has no content sync. Deploy the theme to staging first."; exit 1; }
              ssh production "cd '$PROD_PATH' && wp cli has-command 'sgwrd content'" \
                || { echo "::error::The theme on production has no content sync. Deploy the theme to production first."; exit 1; }

              run_dir="sgwrd-sync/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
              sdir="$(ssh staging "cd '$STAGING_PATH/..' && pwd")/$run_dir"
              pdir="$(ssh production "cd '$PROD_PATH/..' && pwd")/$run_dir"

              cleanup() {
                ssh staging "rm -rf '$sdir'" || true
                ssh production "rm -rf '$pdir'" || true
                rm -rf ./sync
              }
              trap cleanup EXIT

              # 1. Staging writes its changes to a folder.
              ssh staging "cd '$STAGING_PATH' && wp sgwrd content export '$sdir'"

              # 2. The folder goes to production, through this runner.
              mkdir -p sync
              rsync -az "staging:$sdir/" sync/
              ssh production "mkdir -p '$pdir'"
              rsync -az sync/ "production:$pdir/"

              # A dry run first, so the log shows the plan.
              plan="$(ssh production "cd '$PROD_PATH' && wp sgwrd content import '$pdir' --dry-run")"
              printf '%s\n' "$plan"

              if [ "$ACTION" = "content-preview" ]; then
                exit 0
              fi

              if printf '%s\n' "$plan" | grep -q 'Nothing to do'; then
                exit 0
              fi

              # 3. A backup of production. No backup, no sync.
              ssh production "cd '$PROD_PATH' && bash -s -- before-content-sync" < .github/scripts/backup-db.sh

              # 4. Production takes the changes.
              force=""
              [ "$FORCE_CONFLICTS" = "true" ] && force="--force"
              status=0
              ssh production "cd '$PROD_PATH' && wp sgwrd content import '$pdir' $force" || status=$?

              # 5. Staging moves its baseline forward for what went in. This
              #    runs after a partial failure too, for the part that worked.
              if ssh production "test -f '$pdir/result.json'"; then
                rsync -az "production:$pdir/result.json" sync/result.json
                rsync -az sync/result.json "staging:$sdir/result.json"
                ssh staging "cd '$STAGING_PATH' && wp sgwrd content accept '$sdir'"
              fi

              ssh production "cd '$PROD_PATH' && wp cache flush && if wp cli has-command 'breeze purge'; then wp breeze purge --cache=all; fi"
              exit "$status"
              ;;

            wp)
              # The guard step already refused anything that is not one plain
              # WP-CLI call.
              ssh cloudways "cd '$app' && wp $WP_COMMAND"
              ;;

            *)
              echo "::error::Unknown action: $ACTION"
              exit 1
              ;;
          esac

      - name: Clean up
        if: always()
        run: rm -rf ~/.ssh
